server {
  listen 80;
  root /usr/share/nginx/html;

  # Same-origin API calls: the browser talks to nginx, nginx talks to the backend.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  # Single-page app: unknown paths load index.html and React Router takes over.
  location / {
    try_files $uri /index.html;
  }
}
